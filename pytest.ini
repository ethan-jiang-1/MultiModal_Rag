[pytest]
testpaths = ctn2md_tests mrag_vdb_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take longer to run
    ctn2md: Tests for ctn2md module
    mrag_vdb: Tests for mrag_vdb module
    mrag_app: Tests for mrag_app module

addopts = 
    --verbose
    --tb=short
    --strict-markers
    --color=yes
    --cache-clear
    --rootdir=.
    --import-mode=importlib 